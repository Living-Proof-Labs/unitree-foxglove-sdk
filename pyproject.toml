[project]
name = "unitree-foxglove"
version = "0.1.0"
description = "Run the Unitree MuJoCo simulator locally and record/stream its DDS state to Foxglove (MCAP + live)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ANYbotics" }]
# unitree_sdk2py pins cyclonedds==0.10.2, whose newest pre-built wheel is CPython 3.10.
# Anything newer forces a CMake build of CycloneDDS, so we pin the interpreter instead.
requires-python = ">=3.10,<3.11"
dependencies = [
    "unitree_sdk2py",
    "mujoco>=3.1",
    "pygame>=2.5",
    "numpy>=1.26,<2",
    "foxglove-sdk>=0.27",
    "pyyaml>=6",
    # CPU build: the pretrained G1 policy is a small MLP; see [tool.uv.sources].
    "torch>=2.2",
    "websockets>=13",
]

[project.scripts]
unitree-sim = "unitree_foxglove.sim:main"
unitree-bridge = "unitree_foxglove.bridge:main"
unitree-loco = "unitree_foxglove.loco:main"
unitree-stand = "unitree_foxglove.stand:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mcap>=1.2",
    "protobuf>=5",
]

[tool.uv.sources]
unitree_sdk2py = { path = "third_party/unitree_sdk2_python", editable = true }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unitree_foxglove"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# The foxglove/ directory holds layouts, not a Python package.
known-third-party = ["foxglove"]
