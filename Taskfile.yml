version: "3"

vars:
  HOST_UID:
    sh: id -u
  HOST_GID:
    sh: id -g
  FOXGLOVE_URL: "https://app.foxglove.dev/~/view?ds=foxglove-websocket&ds.url=ws%3A%2F%2Flocalhost%3A8765"

env:
  UID: "{{.HOST_UID}}"
  GID: "{{.HOST_GID}}"

tasks:
  build:
    desc: Build the simulator, bridge, and loco image
    cmds:
      - docker compose build

  image-ready:
    internal: true
    preconditions:
      - sh: docker image inspect unitree-foxglove:local >/dev/null 2>&1
        msg: 'Image unitree-foxglove:local is missing. Run task build or the corresponding :with-build task.'

  up:
    desc: G1 in MuJoCo with the Foxglove bridge and the walking policy
    deps: [build]
    cmds:
      - bash scripts/up.sh

  hallway:
    desc: Same as up, in a closed hallway (WORLD=hallway10 or hallway20)
    deps: [build]
    env:
      UNITREE_WORLD: '{{.WORLD | default "hallway10"}}'
    cmds:
      - bash scripts/up.sh

  sim:
    desc: Only the MuJoCo window, no bridge or policy
    deps: [build]
    cmds:
      - docker compose up sim

  foxglove:
    desc: Open the Foxglove web app connected to ws://localhost:8765
    cmds:
      - 'echo "Import foxglove/g1-layout.json once via Layouts > Import."'
      - xdg-open "{{.FOXGLOVE_URL}}"

  test:
    desc: Run unit tests using the existing image
    deps: [image-ready]
    cmds:
      - mkdir -p artifacts/unit
      - docker compose run --rm --no-deps -v "{{.ROOT_DIR}}/artifacts/unit:/reports" --entrypoint pytest sim -p no:cacheprovider tests -o junit_family=xunit1 --junitxml=/reports/junit.xml

  lint:
    desc: Check Python source and tests with Ruff using the existing image
    deps: [image-ready]
    cmds:
      - docker compose run --rm --no-deps -v "{{.ROOT_DIR}}:/workspace:ro" -w /workspace --entrypoint ruff sim check --no-cache src tests scripts

  ci:unit:
    desc: Build, run unit tests, and lint with logs and a terminal cast
    cmds:
      - rm -f artifacts/unit/junit.xml
      - python3 scripts/capture.py artifacts/unit -- task test:with-build
      - python3 scripts/capture.py artifacts/lint -- task lint

  test:with-build:
    desc: Build the image, then run unit tests
    cmds:
      - task: build
      - task: test

  e2e:
    env:
      E2E_MODE: all
    desc: Headless walk and deliberate fall using the existing image
    deps: [image-ready]
    cmds:
      - bash scripts/e2e.sh

  e2e:with-build:
    desc: Build the image, then run the headless walk and deliberate fall
    cmds:
      - task: build
      - task: e2e

  e2e-hallway:
    desc: Headless hallway navigation using the existing image (WORLD=hallway10 or hallway20)
    deps: [image-ready]
    env:
      E2E_WORLD: '{{.WORLD | default "hallway10"}}'
    cmds:
      - bash scripts/e2e_hallway.sh

  e2e-hallway:with-build:
    desc: Build the image, then run headless hallway navigation (WORLD=hallway10 or hallway20)
    cmds:
      - task: build
      - task: e2e-hallway

  e2e-fall:
    desc: Deliberate fall, health incident, and event MCAP without a preceding walk
    deps: [image-ready]
    env:
      E2E_MODE: fall
    cmds:
      - bash scripts/e2e.sh

  e2e-fall:with-build:
    desc: Build the image, then check the deliberate fall and event MCAP
    cmds:
      - task: build
      - task: e2e-fall

  artifacts:render:
    desc: Copy a simulation recording and render MCAP replay screenshots (RUN and WORLD)
    deps: [image-ready]
    requires:
      vars: [RUN]
    cmds:
      - mkdir -p "artifacts/{{.RUN}}"
      - rm -f "artifacts/{{.RUN}}/"*.mcap "artifacts/{{.RUN}}/replay.json"
      - rm -rf "artifacts/{{.RUN}}/screenshots" "artifacts/{{.RUN}}/events"
      - cp -a "recordings/{{.RUN}}/." "artifacts/{{.RUN}}/"
      - docker compose run --rm --no-deps -e MUJOCO_GL=osmesa -v "{{.ROOT_DIR}}/artifacts/{{.RUN}}:/evidence" --entrypoint python sim -m unitree_foxglove.render_mcap /evidence --world "{{.WORLD | default "open"}}"

  artifacts:tests:
    desc: Generate publishable JUnit results (SUITE=unit, e2e-fall, e2e, e2e-hallway)
    requires:
      vars: [SUITE]
    env:
      PYTHONPATH: '{{.ROOT_DIR}}/src'
    cmds:
      - python3 -m unitree_foxglove.test_report "{{.SUITE}}"

  artifacts:summary:
    desc: Summarize a simulation artifact directory (RUN)
    requires:
      vars: [RUN]
    cmds:
      - python3 scripts/summarize.py "artifacts/{{.RUN}}"

  ci:fall:
    desc: Build and validate incident recording with MCAPs, screenshots, logs, and cast
    cmds:
      - python3 scripts/capture.py artifacts/e2e-fall/build -- task build
      - bash scripts/simulation_check.sh fall

  ci:walk:
    desc: Build and run the walk acceptance benchmark with evidence, including on failure
    cmds:
      - python3 scripts/capture.py artifacts/e2e/build -- task build
      - bash scripts/simulation_check.sh walk

  ci:hallway:
    desc: Build and run the hallway acceptance benchmark with evidence, including on failure
    cmds:
      - python3 scripts/capture.py artifacts/e2e-hallway/build -- task build
      - bash scripts/simulation_check.sh hallway

  down:
    desc: Stop every service
    cmds:
      - docker compose --profile foxlet down --remove-orphans
